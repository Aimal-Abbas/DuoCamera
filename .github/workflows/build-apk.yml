# Builds an installable APK on every push to main (or when run by hand from the Actions tab)
# and publishes it on the repository's Releases page, ready to download on your phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DuoCamera-build-${{ github.run_number }}.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoCamera-apk
          path: DuoCamera-build-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DuoCamera build ${{ github.run_number }}
          body: |
            Test build from commit ${{ github.sha }}.
            On your phone: download the .apk below, open it, and allow "Install unknown apps" when asked.
          files: DuoCamera-build-${{ github.run_number }}.apk
